[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mcp"
version = "0.2.0"
description = "MCP server exposing TypeSafe Jev judgments to AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "typesafe-sdk>=0.7.5,<1",  # 0.7.5+: Image assets and Box questions
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
jev-mcp = "jev_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
